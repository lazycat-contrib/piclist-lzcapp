application:
  subdomain: piclist
  background_task: true
  public_path:
    - /
  upstreams:
    - location: /
      backend: http://piclist:36677/
  injects:
    - id: open-save-chooser
      on: browser
      when:
        - /*
      do:
        - src: file:///lzcapp/pkg/content/lazycat-injects/lzc-file-chooser-inject.js
services:
  piclist:
    # kuingsmile/piclist:v1.9.11
    # upstream: docker.io/kuingsmile/piclist:v2.4.2
    image: registry.lazycat.cloud/czyt/kuingsmile/piclist:edb7baa1fb548486
    binds:
      - /lzcapp/var/data:/root/.piclist
    command: /lzcapp/pkg/content/startup.sh
